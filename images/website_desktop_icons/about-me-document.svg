<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" shape-rendering="crispEdges">
  <!-- Pixel-art document icon (crisp-edged rectangles) -->
  <rect width="24" height="24" fill="none"/>

  <!-- Drop shadow -->
  <g fill="#6B6B6B">
    <rect x="7" y="5" width="12" height="1"/>
    <rect x="19" y="6" width="1" height="14"/>
    <rect x="8" y="20" width="11" height="1"/>
  </g>

  <!-- Paper body -->
  <g fill="#F2F2F2">
    <rect x="6" y="4" width="12" height="16"/>
  </g>

  <!-- Outline -->
  <g fill="#2B2B2B">
    <rect x="6" y="3" width="9" height="1"/>
    <rect x="15" y="3" width="3" height="1"/>
    <rect x="5" y="4" width="1" height="16"/>
    <rect x="18" y="4" width="1" height="16"/>
    <rect x="6" y="20" width="13" height="1"/>
  </g>

  <!-- Folded corner -->
  <g fill="#D9D9D9">
    <rect x="15" y="4" width="3" height="3"/>
  </g>
  <g fill="#B5B5B5">
    <rect x="15" y="4" width="1" height="3"/>
    <rect x="15" y="7" width="3" height="1"/>
  </g>

  <!-- Text lines -->
  <g fill="#7A7A7A">
    <rect x="7" y="8" width="9" height="1"/>
    <rect x="7" y="10" width="8" height="1"/>
    <rect x="7" y="12" width="9" height="1"/>
    <rect x="7" y="14" width="7" height="1"/>
    <rect x="7" y="16" width="8" height="1"/>
  </g>

  <!-- Small "ID photo" thumbnail block -->
  <g fill="#C9D7E8">
    <rect x="14" y="15" width="3" height="3"/>
  </g>
  <g fill="#6A86A8">
    <rect x="14" y="15" width="3" height="1"/>
    <rect x="14" y="17" width="3" height="1"/>
    <rect x="14" y="15" width="1" height="3"/>
    <rect x="16" y="15" width="1" height="3"/>
  </g>
</svg>


