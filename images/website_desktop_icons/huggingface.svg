<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" shape-rendering="crispEdges">
  <!-- Pixel-art style 🤗 (hugging face). Built from rectangles for crisp edges. -->
  <rect width="24" height="24" fill="none"/>

  <!-- Face base -->
  <g fill="#F9D648">
    <rect x="8" y="2" width="8" height="1"/>
    <rect x="6" y="3" width="12" height="1"/>
    <rect x="5" y="4" width="14" height="1"/>
    <rect x="4" y="5" width="16" height="1"/>
    <rect x="3" y="6" width="18" height="1"/>
    <rect x="3" y="7" width="18" height="1"/>
    <rect x="2" y="8" width="20" height="1"/>
    <rect x="2" y="9" width="20" height="1"/>
    <rect x="2" y="10" width="20" height="1"/>
    <rect x="2" y="11" width="20" height="1"/>
    <rect x="3" y="12" width="18" height="1"/>
    <rect x="3" y="13" width="18" height="1"/>
    <rect x="4" y="14" width="16" height="1"/>
    <rect x="5" y="15" width="14" height="1"/>
    <rect x="6" y="16" width="12" height="1"/>
    <rect x="8" y="17" width="8" height="1"/>
  </g>

  <!-- Face outline -->
  <g fill="#C58B00">
    <rect x="8" y="1" width="8" height="1"/>
    <rect x="6" y="2" width="2" height="1"/>
    <rect x="16" y="2" width="2" height="1"/>
    <rect x="5" y="3" width="1" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="4" y="4" width="1" height="1"/>
    <rect x="19" y="4" width="1" height="1"/>
    <rect x="3" y="5" width="1" height="1"/>
    <rect x="20" y="5" width="1" height="1"/>
    <rect x="2" y="6" width="1" height="2"/>
    <rect x="21" y="6" width="1" height="2"/>
    <rect x="1" y="8" width="1" height="4"/>
    <rect x="22" y="8" width="1" height="4"/>
    <rect x="2" y="12" width="1" height="2"/>
    <rect x="21" y="12" width="1" height="2"/>
    <rect x="3" y="14" width="1" height="1"/>
    <rect x="20" y="14" width="1" height="1"/>
    <rect x="4" y="15" width="1" height="1"/>
    <rect x="19" y="15" width="1" height="1"/>
    <rect x="5" y="16" width="1" height="1"/>
    <rect x="18" y="16" width="1" height="1"/>
    <rect x="6" y="17" width="2" height="1"/>
    <rect x="16" y="17" width="2" height="1"/>
    <rect x="8" y="18" width="8" height="1"/>
  </g>

  <!-- Eyes -->
  <g fill="#3B2A1A">
    <rect x="8" y="9" width="2" height="2"/>
    <rect x="14" y="9" width="2" height="2"/>
  </g>

  <!-- Smile -->
  <g fill="#7A3E00">
    <rect x="10" y="13" width="4" height="1"/>
    <rect x="9" y="12" width="1" height="1"/>
    <rect x="14" y="12" width="1" height="1"/>
    <rect x="10" y="14" width="1" height="1"/>
    <rect x="13" y="14" width="1" height="1"/>
  </g>

  <!-- Cheeks -->
  <g fill="#F4A9B8">
    <rect x="6" y="12" width="2" height="1"/>
    <rect x="16" y="12" width="2" height="1"/>
  </g>

  <!-- Hands (hugging) -->
  <g fill="#F1B24A">
    <rect x="2" y="15" width="6" height="4"/>
    <rect x="16" y="15" width="6" height="4"/>
    <rect x="6" y="16" width="3" height="3"/>
    <rect x="15" y="16" width="3" height="3"/>
  </g>

  <!-- Hands outline -->
  <g fill="#B87400">
    <rect x="1" y="15" width="1" height="4"/>
    <rect x="2" y="14" width="6" height="1"/>
    <rect x="8" y="15" width="1" height="4"/>
    <rect x="2" y="19" width="7" height="1"/>

    <rect x="22" y="15" width="1" height="4"/>
    <rect x="16" y="14" width="6" height="1"/>
    <rect x="15" y="15" width="1" height="4"/>
    <rect x="15" y="19" width="7" height="1"/>
  </g>
</svg>


