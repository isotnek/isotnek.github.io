    <rect x="20" y="14" width="8" height="1"/>
    <rect x="18" y="15" width="12" height="1"/>
    <rect x="17" y="16" width="14" height="1"/>
    <rect x="16" y="17" width="16" height="1"/>
    <rect x="16" y="18" width="16" height="1"/>
    <rect x="15" y="19" width="18" height="1"/>
    <rect x="15" y="20" width="18" height="1"/>
    <rect x="15" y="21" width="18" height="1"/>
    <rect x="15" y="22" width="18" height="1"/>
    <rect x="16" y="23" width="16" height="1"/>
    <rect x="16" y="24" width="16" height="1"/>
    <rect x="17" y="25" width="14" height="1"/>
