    <rect x="12" y="29" width="24" height="1"/>
    <rect x="11" y="30" width="26" height="1"/>
    <rect x="10" y="31" width="28" height="1"/>
    <rect x="10" y="32" width="28" height="1"/>
    <rect x="10" y="33" width="28" height="1"/>
    <rect x="10" y="34" width="28" height="1"/>
    <rect x="10" y="35" width="28" height="1"/>
    <rect x="10" y="36" width="28" height="1"/>
    <rect x="10" y="37" width="28" height="1"/>
    <rect x="11" y="38" width="26" height="1"/>
    <rect x="12" y="39" width="24" height="1"/>
    <rect x="13" y="40" width="22" height="1"/>
